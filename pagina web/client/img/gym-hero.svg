<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" role="img" aria-labelledby="hero-svg-title hero-svg-desc">
  <title id="hero-svg-title">Entrenamiento y Bienestar FitBook</title>
  <desc id="hero-svg-desc">Ilustración deportiva que representa pesas, cronómetro, hidratación y energía en el gimnasio</desc>
  <defs>
    <linearGradient id="gymGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Fondo dinámico con bordes suaves -->
  <rect width="400" height="300" rx="24" fill="url(#gymGlow)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Líneas de pulso / energía -->
  <path d="M40 180 H 110 L 130 140 L 150 210 L 175 165 L 190 180 H 360" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- Mancuerna principal (Dumbbell) -->
  <g transform="translate(140, 75)">
    <!-- Barra central -->
    <rect x="35" y="42" width="50" height="12" rx="4" fill="#cbd5e1"/>
    <!-- Discos izquierdos -->
    <rect x="22" y="24" width="14" height="48" rx="6" fill="url(#purpleGrad)"/>
    <rect x="8" y="32" width="14" height="32" rx="5" fill="#475569"/>
    <!-- Discos derechos -->
    <rect x="84" y="24" width="14" height="48" rx="6" fill="url(#purpleGrad)"/>
    <rect x="98" y="32" width="14" height="32" rx="5" fill="#475569"/>
    <!-- Brillo -->
    <circle cx="29" cy="36" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="91" cy="36" r="3" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Cronómetro flotante (Timing) -->
  <g transform="translate(60, 60)">
    <circle cx="30" cy="34" r="24" fill="#1e1b4b" stroke="url(#tealGrad)" stroke-width="3"/>
    <path d="M30 10 V 16 M26 10 H 34" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 34 L 30 22 M30 34 L 38 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Medalla / Aprobado de meta cumplida -->
  <g transform="translate(265, 140)">
    <circle cx="35" cy="35" r="26" fill="#1e293b" stroke="url(#purpleGrad)" stroke-width="3"/>
    <path d="M24 35 L 32 43 L 48 27" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Insignia de caloría / fuego -->
  <g transform="translate(75, 180)">
    <rect width="64" height="28" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="16" cy="14" r="6" fill="#f43f5e"/>
    <text x="28" y="18" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">FIT</text>
  </g>
</svg>
